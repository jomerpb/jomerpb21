name: Update Lotto Data Daily

on:
  schedule:
    # Runs at 14:00 UTC every day (which is 10:00 PM Philippine Time)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows you to run this manually from the GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install PCSOLotto-Webscraper
        
      - name: Run Scraper Script
        run: python scraper.py
        
      - name: Commit and Push Data Update
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add lotto-results.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of live lotto results" && git push)
